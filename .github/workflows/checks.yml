name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  json-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q app.py json_utils.py theme.py state.py
      - name: Test response parsing without API access
        run: python -m unittest discover -s tests -v
